name: Monitoraggio ritardi treni Chieri

on:
  schedule:
    # Unico schedule: ogni 10 minuti, tutti i giorni. GitHub non garantisce
    # la precisione al minuto (può slittare di qualche minuto nei momenti
    # di carico), per questo il report di fine giornata NON si basa su un
    # singolo orario esatto ma viene ritentato più volte (vedi sotto).
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      giorno:
        description: "Rigenera manualmente il report di un giorno specifico (formato YYYY-MM-DD). Lascia vuoto per il comportamento automatico normale."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rileva tabellone arrivi
        run: python tracker.py

      - name: Genera report giornaliero
        run: |
          GIORNO_MANUALE="${{ github.event.inputs.giorno }}"
          if [ -n "$GIORNO_MANUALE" ]; then
            echo "Rigenerazione manuale richiesta per $GIORNO_MANUALE"
            python generate_report.py "$GIORNO_MANUALE"
          else
            # Comportamento automatico: durante la prima ora del nuovo giorno
            # (ora italiana), prova a generare il report del giorno APPENA
            # concluso. Essendo eseguito ogni 10 minuti, ci sono circa 6
            # tentativi in quell'ora: ne basta uno solo andato a buon fine.
            # generate_report.py è idempotente, quindi i tentativi successivi
            # non creano duplicati né commit inutili.
            ORA_LOCALE=$(TZ=Europe/Rome date +%H)
            if [ "$ORA_LOCALE" = "00" ]; then
              IERI=$(TZ=Europe/Rome date -d "yesterday" +%Y-%m-%d)
              echo "Generazione automatica per $IERI"
              python generate_report.py "$IERI"
            fi
          fi

      - name: Commit dati aggiornati
        run: |
          git config user.name "train-delay-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Aggiornamento dati $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

